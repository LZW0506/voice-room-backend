server {
    listen 8004 ssl;
    server_name 82.157.174.249;

    root /www/sites/voice/index;
    index index.html;

    ssl_certificate /usr/local/openresty/nginx/conf/ssl/voice-room-fullchain.pem;
    ssl_certificate_key /usr/local/openresty/nginx/conf/ssl/voice-room-privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    access_log /www/sites/voice/log/access.log main;
    error_log /www/sites/voice/log/error.log;

    location ~ ^/(\.user.ini|\.htaccess|\.git|\.env|\.svn|\.project|LICENSE|README.md) {
        return 404;
    }

    location ^~ /api/ {
        proxy_pass http://172.17.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://172.17.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ^~ /rtc {
        proxy_pass http://172.17.0.1:7880;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    location ^~ /.well-known/acme-challenge/ {
        root /usr/share/nginx/html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
