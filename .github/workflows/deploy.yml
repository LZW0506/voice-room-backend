name: 部署后端服务

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: 测试后端
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: 运行测试
        run: go test ./...

  deploy:
    name: 构建并部署 Docker 服务
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 SSH
        uses: webfactory/ssh-agent@v0.9.1
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: 上传后端项目
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            'mkdir -p /opt/voice-room-backend'
          rsync -az --delete --exclude '.env' --exclude '.git' \
            -e 'ssh -o StrictHostKeyChecking=no' ./ \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/voice-room-backend/"

      - name: 写入生产配置
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          LIVEKIT_API_KEY: ${{ secrets.LIVEKIT_API_KEY }}
          LIVEKIT_API_SECRET: ${{ secrets.LIVEKIT_API_SECRET }}
        run: |
          env_file="$RUNNER_TEMP/voice-room-backend.env"
          {
            printf 'LIVEKIT_API_KEY=%s\n' "$LIVEKIT_API_KEY"
            printf 'LIVEKIT_API_SECRET=%s\n' "$LIVEKIT_API_SECRET"
            printf 'LIVEKIT_URL=ws://livekit:7880\n'
            printf 'LIVEKIT_PUBLIC_URL=ws://82.157.174.249:7880\n'
            printf 'LIVEKIT_NODE_IP=82.157.174.249\n'
            printf 'PORT=8787\n'
          } > "$env_file"
          scp -o StrictHostKeyChecking=no "$env_file" \
            "$DEPLOY_USER@$DEPLOY_HOST:/opt/voice-room-backend/.env"

      - name: 启动 Docker 容器
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -o StrictHostKeyChecking=no "$DEPLOY_USER@$DEPLOY_HOST" \
            'cd /opt/voice-room-backend && docker compose --env-file .env up -d --build livekit backend'
